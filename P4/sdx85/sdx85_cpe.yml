---
profiles:
  - SDX85_CPE
target: sdx85
subtarget: cpe
description: Build image for sdx85 board cpe profile

additional_packages:
  - feed: packages
    packages:
      - aria2
      - libroxml
      - openvpn-mbedtls
      - openssh-sftp-client
      - iputils-arping
      - conntrack-tools
      - file
      - fping
      - rng-tools
      - lvm2

packages:
  - busybox
  - ethtool-full
  - procd
  - iptables-mod-conntrack-extra
  - kmod-ipt-ipopt
  - kmod-ipt-ipset
  - kmod-ipt-raw
  - kmod-ipt-physdev
  - iptables-mod-ipopt
  - iptables-mod-physdev
  - ipset
  - kmod-br-netfilter
  - kmod-ebtables
  - kmod-ebtables-ipv4
  - kmod-ebtables-ipv6
  - kmod-ebtables-watchers
  - libbpf
  - ebtables
  - ebtables-utils
  - ip-full
  - libipset
  - procd-seccomp
  - procd-ujail
  - procd-ujail-console
  - wireless-tools
  - kmod-rtsp-alg
  - ebtables-legacy
  - libip4tc
  - libip6tc
  - kmod-ipt-debug
  - kmod-ipt-raw6
  - dmverity-utils
  - libhealthmon
  - libc
  - libxtables12
  - kmod-ipt-core
  - kmod-ipt-u32
  - iptables-mod-u32
  - kmod-gre
  - kmod-gre6
  - gre
  - wifi-scripts
  - health-monitor
  - libhealth_monitor
  - health-monitor-demo
  - e2fsprogs
  - resize2fs
  - recovery-std
  - updater-std
  - crash-collect-hlos
  - log-collector
  - fdt-utils

diffconfig: |
  CONFIG_TARGET_ROOTFS_UBIFS=y
  CONFIG_TARGET_ROOTFS_EXT4FS=y
  CONFIG_TARGET_PER_DEVICE_ROOTFS=y
  CONFIG_DEVEL=y
  CONFIG_ATH_USER_REGD=y
  CONFIG_BUILD_LOG=y
  CONFIG_BUILD_LOG_DIR=""
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_ARP=n
  CONFIG_BUSYBOX_CONFIG_ARPING=y
  CONFIG_BUSYBOX_CONFIG_TR=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TR_CLASSES=y
  CONFIG_BUSYBOX_CONFIG_PRINTENV=y
  CONFIG_BUSYBOX_CONFIG_BUSYBOX=y
  CONFIG_BUSYBOX_CONFIG_UNZIP=y
  CONFIG_BUSYBOX_DEFAULT_FEATURE_STAT_FORMAT=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_PREFER_APPLETS=y
  CONFIG_BUSYBOX_CONFIG_NOHUP=y
  CONFIG_BUSYBOX_CONFIG_TELNET=y
  # CONFIG_BUSYBOX_CONFIG_FEATURE_TELNET_TTYPE is not set
  # CONFIG_BUSYBOX_CONFIG_FEATURE_TELNET_AUTOLOGIN is not set
  # CONFIG_BUSYBOX_CONFIG_FEATURE_TELNET_WIDTH is not set
  CONFIG_BUSYBOX_CONFIG_VCONFIG=y
  CONFIG_OPENVPN_mbedtls_ENABLE_IPROUTE2=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_SORT_BIG=y
  CONFIG_BUSYBOX_CONFIG_TASKSET=y
  CONFIG_BUSYBOX_CONFIG_SHA1SUM=y
  CONFIG_BUSYBOX_CONFIG_DIFF=y
  CONFIG_BUSYBOX_CONFIG_LSOF=y
  CONFIG_BUSYBOX_CONFIG_DIFFUTILS=y
  CONFIG_BUSYBOX_CONFIG_WATCH=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_DF_FANCY=y
  CONFIG_BUSYBOX_CONFIG_FLOAT_DURATION=y
  CONFIG_BUSYBOX_CONFIG_REALPATH=y
  CONFIG_BUSYBOX_CONFIG_OD=y
  CONFIG_BUSYBOX_CONFIG_DESKTOP=y
  CONFIG_BUSYBOX_CONFIG_MPSTAT=y
  CONFIG_BUSYBOX_CONFIG_DD=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_DD_SIGNAL_HANDLING=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_DD_THIRD_STATUS_LINE=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_DD_IBS_OBS=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_DD_STATUS=y
  CONFIG_BUSYBOX_CONFIG_TFTP=y
  CONFIG_BUSYBOX_CONFIG_TFTPD=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_GET=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_PUT=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_BLOCKSIZE=y
  CONFIG_BUSYBOX_CONFIG_INOTIFYD=y
  CONFIG_TOOLCHAINOPTS=y
  CONFIG_GCC_USE_VERSION_9=n
  CONFIG_COLLECT_KERNEL_DEBUG=y
  # CONFIG_LIBC_USE_UCLIBC is not set
  CONFIG_PKG_FORTIFY_SOURCE_NONE=y
  CONFIG_PKG_ASLR_PIE_ALL=y
  CONFIG_PKG_CC_STACKPROTECTOR_STRONG=y
  # CONFIG_TARGET_ROOTFS_INITRAMFS is not set
  CONFIG_KERNEL_PERF_EVENTS=y
  CONFIG_KERNEL_PROFILING=y
  CONFIG_ARIA2_SFTP=y
  CONFIG_PACKAGE_dnsmasq=n
  # CONFIG_PACKAGE_dnsmasq_full_broken_rtc is not set
  # CONFIG_DEFAULT_hostapd-daemon is not set
  # CONFIG_PACKAGE_hostapd-daemon is not set
  # CONFIG_DEFAULT_wlan-uci is not set
  # CONFIG_DEFAULT_wpa-supplicant-8-lib is not set
  # CONFIG_DEFAULT_wpa-supplicant-qcacld is not set
  # CONFIG_PACKAGE_wlan-uci is not set
  # CONFIG_PACKAGE_wpa-supplicant-8-lib is not set
  # CONFIG_PACKAGE_wpa-supplicant-qcacld is not set
  CONFIG_WIFI_MONITOR_SUPPORT=y
  CONFIG_CNSS2_MODULE=y
  CONFIG_OPENSSL_WITH_DTLS=y
  CONFIG_PACKAGE_firewall=n
  CONFIG_DEFAULT_firewall4=n
  CONFIG_PACKAGE_iptables-zz-legacy=y
  CONFIG_PACKAGE_ip6tables-zz-legacy=y
  CONFIG_PACKAGE_libgpt=m
  CONFIG_PACKAGE_abctl=m
  CONFIG_PACKAGE_usb-composition-ab=m
  CONFIG_PACKAGE_librecovery-updater-msm=y
  CONFIG_PACKAGE_recovery-ab=m
  CONFIG_PACKAGE_applypatch-ab=m
  CONFIG_PACKAGE_updater-ab=m
  CONFIG_PACKAGE_telux-swupdate-ab=n
  CONFIG_PACKAGE_edify-ab=m
  CONFIG_PACKAGE_mirror-copy-ab=m
  CONFIG_PACKAGE_kmod-shortcut-fe=n
  CONFIG_PACKAGE_libgdbm=m
  CONFIG_PACKAGE_libdbus=m
  CONFIG_PACKAGE_dbus=m
  CONFIG_PACKAGE_ATH_DEBUG=y
  CONFIG_SAH_AMX_TR181_CELLULAR_ORDER=25
  CONFIG_PREINITOPT=y
  CONFIG_TARGET_PREINIT_DISABLE_FAILSAFE=y
